<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #333;
    }
    .calculator {
      background: #111;
      padding: 20px;
      border-radius: 15px;
    }
    input {
      width: 100%;
      height: 60px;
      font-size: 24px;
      margin-bottom: 15px;
      text-align: right;
      border-radius: 10px;
      padding: 10px;
      background: #444;
      color: white;
      border: none;
    }
    button {
      width: 60px;
      height: 60px;
      font-size: 22px;
      margin: 5px;
      border-radius: 10px;
      border: none;
      background: #666;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #888;
    }
    .equal {
      background: orangered;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <p id="id">okhjkn kjnm</p>
    <input type="text" id="result" >
    <br>
    <button >AC</button>
    <button >DE</button>
    <button >%</button>
    <button >÷</button>
    <br>
    <button >7</button>
    <button >8</button>
    <button >9</button>
    <button >×</button>
    <br>
    <button >4</button>
    <button >5</button>
    <button >6</button>
    <button >-</button>
    <br>
    <button >1</button>
    <button >2</button>
    <button >3</button>
    <button >+</button>
    <br>
    <button >0</button>
    <button >.</button>
    <button class="equal" >=</button>
  </div>
  <!-- <script src="/Frontend/JavaScript/cal.js"></script> -->

  <!-- <!-- <script src="/Frontend/JavaScript/calculator.js"> -->
   
  </script> -->
</body>
</html>
